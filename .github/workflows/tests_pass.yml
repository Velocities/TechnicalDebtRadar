# This workflow ensures our tests pass
name: Tests Pass

on:
  pull_request:
    branches:
      # Every merge into main from dev should trigger this workflow
      - main
    paths:
      # Remember this folder includes tests (so if any tests were added, modified or deleted, this workflow will run)
      - 'src/**'
      - 'build.sbt'
      - 'project/build.properties'
      - 'project/plugins.sbt'
      - 'scripts/**'

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt -batch test
