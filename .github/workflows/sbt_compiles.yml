# This workflow ensures the project can be compiled using sbt
name: Sbt Compiles

on:
  pull_request:
    branches:
      # Every merge into dev should trigger this workflow
      - dev
    paths:
      - 'src/**'
      - 'build.sbt'
      - 'project/build.properties'
      - 'project/plugins.sbt'
      - 'scripts/**'

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Compile (main + tests)
        run: sbt -batch "Test / compile"
